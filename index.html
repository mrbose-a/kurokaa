<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kurokaa — The Agentic OS for Indian Restaurants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F6F1E6;
    --paper-2: #EFE9DA;
    --paper-3: #E6DFCD;
    --ink: #0A0F22;
    --ink-2: #1B2038;
    --ink-soft: #4B4E63;
    --ink-mute: #7D7C87;
    --rule: #2E2A1F1A; /* warm hairline */
    --rule-strong: #2E2A1F33;
    --gold: #B07A22;
    --gold-2: #C99659;
    --gold-soft: #B07A2222;
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  /* Warm grain overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.55;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  /* layout */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 48px; position: relative; z-index: 2; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  /* Reusable type */
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eyebrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-1px);
  }
  .display {
    font-family: var(--serif);
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 0.98;
  }
  .display em { font-style: italic; color: var(--gold); font-weight: 500; }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklch, var(--paper) 88%, transparent);
    backdrop-filter: saturate(120%) blur(8px);
    -webkit-backdrop-filter: saturate(120%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand .mark { height: 22px; width: auto; display: block; }
  .brand .tm { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); align-self: flex-start; margin-top: 2px; }

  .nav-links { display: flex; gap: 28px; }
  .nav-link {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    background: none; border: 0; padding: 0;
    transition: color .2s ease;
  }
  .nav-link:hover, .nav-link[data-active="true"] { color: var(--ink); }
  .nav-link[data-active="true"] .num { color: var(--gold); }
  .nav-link .num { color: var(--ink-mute); margin-right: 8px; }
  @media (max-width: 820px) { .nav-links { display: none; } }

  .nav-cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .nav-cta:hover { background: var(--ink-2); transform: translateY(-1px); }

  /* HERO */
  .hero { position: relative; padding: 90px 0 60px; }
  .hero-spotlight {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px 320px at var(--mx, 50%) var(--my, 35%), rgba(176,122,34,0.10), transparent 70%);
    transition: background .2s ease;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1.35fr 1fr; gap: 80px;
    align-items: end;
  }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }

  .hero h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(56px, 8.8vw, 132px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin: 22px 0 0;
    color: var(--ink);
  }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero .lede {
    font-family: var(--serif);
    font-size: clamp(20px, 2vw, 26px);
    line-height: 1.35;
    color: var(--ink-soft);
    max-width: 52ch;
    margin: 28px 0 0;
  }

  .hero-meta {
    display: flex; flex-direction: column; gap: 22px;
    padding-bottom: 6px;
  }
  .meta-card {
    border: 1px solid var(--rule-strong);
    padding: 22px 22px 20px;
    border-radius: 4px;
    background: color-mix(in oklch, var(--paper) 70%, white);
  }
  .meta-card .eyebrow { margin-bottom: 14px; display: block; }
  .meta-card .ticker {
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.1;
    font-style: italic;
    color: var(--ink);
    min-height: 1.2em;
    display: flex; align-items: center; gap: 10px;
  }
  .meta-card .ticker .cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--gold);
    animation: blink 1s steps(2,end) infinite;
    transform: translateY(2px);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cd-cell { text-align: left; }
  .cd-num {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .cd-lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-top: 6px;
  }

  /* email capture */
  .capture { margin-top: 44px; max-width: 620px; }
  .capture-row {
    display: flex; align-items: stretch; gap: 0;
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: color-mix(in oklch, var(--paper) 60%, white);
    overflow: hidden;
    transition: box-shadow .25s ease, border-color .2s ease;
  }
  .capture-row:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-soft);
  }
  .capture-row.error { border-color: #8B2A2A; box-shadow: 0 0 0 4px rgba(139,42,42,0.12); }
  .capture-row input {
    flex: 1; min-width: 0;
    border: 0; outline: 0;
    background: transparent;
    padding: 18px 24px;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
  }
  .capture-row input::placeholder { color: var(--ink-mute); }
  .capture-row button {
    border: 0; cursor: pointer;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0 28px;
    transition: background .2s ease, color .2s ease;
    display: flex; align-items: center; gap: 8px;
  }
  .capture-row button:hover:not(:disabled) { background: var(--gold); }
  .capture-row button:disabled { opacity: 0.7; cursor: progress; }
  .capture-row button svg { width: 14px; height: 14px; }

  .capture-help {
    margin-top: 14px;
    display: flex; gap: 16px; align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-mute);
  }
  .capture-help.error { color: #8B2A2A; }
  .capture-help.success { color: #1F5C3B; }
  .capture-help .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
  }
  .capture-help .pill .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  .hero-foot {
    margin-top: 80px;
    display: flex; justify-content: space-between; align-items: end;
    gap: 24px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .num { font-family: var(--serif); font-size: 38px; line-height: 1; }
  .stat .num em { color: var(--gold); font-style: italic; }
  .stat .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }
  @media (max-width: 720px) { .hero-foot { flex-wrap: wrap; gap: 28px; } }

  /* section frame */
  section.scene { padding: 120px 0; position: relative; }
  section.scene + section.scene { border-top: 1px solid var(--rule); }

  .section-head {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px;
    margin-bottom: 64px;
    align-items: end;
  }
  @media (max-width: 980px) { .section-head { grid-template-columns: 1fr; gap: 24px; } }

  .section-head .left .eyebrow { display: block; margin-bottom: 14px; }
  .section-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(48px, 6vw, 92px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .section-head h2 em { font-style: italic; color: var(--gold); }
  .section-head .right p {
    font-family: var(--serif);
    font-size: clamp(20px, 1.6vw, 24px);
    line-height: 1.4;
    color: var(--ink-soft);
    margin: 0;
  }

  /* STORY */
  .story-layout { display: grid; grid-template-columns: 1fr 1.1fr; gap: 80px; align-items: start; }
  @media (max-width: 980px) { .story-layout { grid-template-columns: 1fr; gap: 48px; } }

  .story-figure {
    border: 1px solid var(--rule-strong);
    background: linear-gradient(180deg, var(--paper-2), var(--paper-3));
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .story-figure .figure-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 25%;
    z-index: 1;
    display: block;
    filter: saturate(0.92) contrast(1.02);
  }
  .story-figure .figure-tag {
    position: relative; z-index: 2;
    padding: 22px 24px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--paper);
    background: linear-gradient(180deg, rgba(10,15,34,0.55), transparent);
  }
  .story-figure .figure-cap {
    position: relative; z-index: 2;
    padding: 24px;
    font-family: var(--mono); font-size: 11px; color: var(--paper);
    background: linear-gradient(0deg, rgba(10,15,34,0.7), transparent);
  }
  .story-figure .figure-cap b { color: var(--paper); font-weight: 600; }
  .story-figure .figure-glyph {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: var(--serif); font-style: italic;
    font-size: clamp(90px, 14vw, 180px);
    color: var(--ink);
    opacity: 0.9;
    z-index: 1;
  }
  .story-figure .figure-glyph .acc { color: var(--gold); }

  .story-copy { font-family: var(--serif); font-size: 22px; line-height: 1.55; color: var(--ink); }
  .story-copy .dropcap::first-letter {
    font-family: var(--serif);
    font-size: 5em;
    line-height: 0.82;
    float: left;
    padding: 6px 14px 0 0;
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
  }
  .story-copy p + p { margin-top: 22px; }
  .story-copy em { color: var(--gold); font-style: italic; }

  .story-meta {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex; gap: 32px; flex-wrap: wrap;
  }
  .story-meta .kv { display: flex; flex-direction: column; gap: 4px; }
  .story-meta .kv .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }
  .story-meta .kv .v { font-family: var(--sans); font-size: 15px; color: var(--ink); }

  /* WHY */
  .why-scene { background: var(--ink); color: var(--paper); }
  .why-scene::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(800px 380px at 20% -10%, rgba(176,122,34,0.18), transparent 60%),
      radial-gradient(600px 260px at 90% 110%, rgba(176,122,34,0.10), transparent 60%);
    pointer-events: none;
  }
  .why-scene .eyebrow { color: var(--gold-2); }
  .why-scene h2 { color: var(--paper); }
  .why-scene .section-head .right p { color: color-mix(in oklch, var(--paper) 75%, transparent); }
  .why-scene + .scene { border-top: 0; }

  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; position: relative; }
  @media (max-width: 980px) { .pillars { grid-template-columns: 1fr; } }
  .pillar {
    border: 1px solid rgba(246,241,230,0.16);
    background: rgba(246,241,230,0.03);
    padding: 28px 26px 30px;
    border-radius: 4px;
    position: relative;
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .pillar:hover {
    background: rgba(246,241,230,0.06);
    border-color: rgba(201,150,89,0.5);
    transform: translateY(-3px);
  }
  .pillar .pn {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    color: var(--gold-2);
  }
  .pillar h3 {
    font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.05;
    margin: 18px 0 14px;
    letter-spacing: -0.01em;
  }
  .pillar h3 em { color: var(--gold-2); font-style: italic; }
  .pillar p { color: color-mix(in oklch, var(--paper) 80%, transparent); font-size: 15px; line-height: 1.55; margin: 0; }
  .pillar .underline {
    margin-top: 22px;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-2);
  }
  .pillar .underline .arr {
    width: 24px; height: 1px; background: var(--gold-2);
    transition: width .25s ease;
  }
  .pillar:hover .underline .arr { width: 48px; }

  /* WHAT */
  .agents-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 18px;
  }
  .agent {
    border: 1px solid var(--rule-strong);
    background: color-mix(in oklch, var(--paper) 60%, white);
    padding: 26px 24px 28px;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    transition: background .25s ease, transform .25s ease, border-color .25s ease;
    display: flex; flex-direction: column; gap: 18px;
    min-height: 220px;
  }
  .agent:hover {
    border-color: var(--ink);
    background: color-mix(in oklch, var(--paper) 30%, white);
    transform: translateY(-3px);
  }
  .agent[data-active="true"] {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
  }
  .agent[data-active="true"] .agent-name { color: var(--paper); }
  .agent[data-active="true"] .agent-num { color: var(--gold-2); }
  .agent[data-active="true"] .agent-blurb { color: color-mix(in oklch, var(--paper) 75%, transparent); }
  .agent[data-active="true"] .agent-icon { color: var(--gold-2); border-color: rgba(246,241,230,0.4); }

  .agent .agent-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .agent-num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--ink-mute); }
  .agent-icon {
    width: 40px; height: 40px;
    border: 1px solid var(--rule-strong);
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--gold);
    transition: color .25s ease, border-color .25s ease, transform .4s ease;
  }
  .agent:hover .agent-icon { transform: rotate(8deg); }
  .agent-name {
    font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .agent-blurb { font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
  .agent-foot {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: end;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .agent[data-active="true"] .agent-foot { color: color-mix(in oklch, var(--paper) 60%, transparent); }

  /* Grid spans for editorial rhythm */
  .agent.s4 { grid-column: span 4; }
  .agent.s6 { grid-column: span 6; }
  .agent.s8 { grid-column: span 8; }
  @media (max-width: 980px) {
    .agent.s4, .agent.s6, .agent.s8 { grid-column: span 12; }
  }

  .what-stat-row {
    margin-top: 32px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule-strong);
  }
  @media (max-width: 720px) { .what-stat-row { grid-template-columns: 1fr; } }
  .ws {
    padding: 28px 24px;
    border-right: 1px solid var(--rule);
  }
  .ws:last-child { border-right: 0; }
  @media (max-width: 720px) { .ws { border-right: 0; border-bottom: 1px solid var(--rule); } .ws:last-child { border-bottom: 0; } }
  .ws .v { font-family: var(--serif); font-size: 56px; line-height: 1; letter-spacing: -0.02em; }
  .ws .v em { color: var(--gold); font-style: italic; }
  .ws .v sup { font-size: 0.45em; vertical-align: super; color: var(--ink-mute); margin-left: 4px; }
  .ws .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-top: 12px; }

  /* MESSAGE */
  .msg-scene { background: var(--paper-2); }
  .msg-grid { display: grid; grid-template-columns: 0.9fr 1.2fr; gap: 80px; align-items: start; }
  @media (max-width: 980px) { .msg-grid { grid-template-columns: 1fr; gap: 48px; } }
  .msg-left h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 5vw, 72px); line-height: 0.98; margin: 12px 0 0; letter-spacing: -0.02em; }
  .msg-left h2 em { font-style: italic; color: var(--gold); }
  .msg-left p { font-family: var(--serif); font-size: 20px; line-height: 1.45; color: var(--ink-soft); margin-top: 18px; }
  .msg-left .quote {
    margin-top: 32px;
    padding: 22px 24px;
    border-left: 3px solid var(--gold);
    background: color-mix(in oklch, var(--paper) 60%, white);
    font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 18px; line-height: 1.5;
  }
  .msg-left .quote .who {
    display: block; margin-top: 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); font-style: normal;
  }

  .form-card {
    background: color-mix(in oklch, var(--paper) 50%, white);
    border: 1px solid var(--rule-strong);
    padding: 32px 32px 28px;
    border-radius: 6px;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .field label .count { color: var(--ink-mute); }
  .field input, .field textarea, .field select {
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 12px 14px;
    outline: 0;
    transition: border-color .2s ease, box-shadow .2s ease;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--gold);

const TICKER_LINES = [

function useTicker(lines, { type = 38, hold = 1600, erase = 22 } = {}) {
  const [i, setI] = useState(0);
  const [text, setText] = useState('');
  const [phase, setPhase] = useState('typing'); // typing | holding | erasing
  useEffect(() => {
    const full = lines[i];
    let id;
    if (phase === 'typing') {
      if (text.length < full.length) id = setTimeout(() => setText(full.slice(0, text.length + 1)), type);else
      id = setTimeout(() => setPhase('holding'), hold);
    } else if (phase === 'holding') {
      id = setTimeout(() => setPhase('erasing'), hold);
    } else {
      if (text.length > 0) id = setTimeout(() => setText(text.slice(0, -1)), erase);else
      {setPhase('typing');setI((i + 1) % lines.length);}
    }
    return () => clearTimeout(id);
  }, [text, phase, i, lines, type, hold, erase]);
  return text;
}

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Tell us what to call you.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'A real email, please.';
    if (!form.message.trim() || form.message.trim().length < 12) e.message = 'A sentence or two — what should we know?';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async (e) => {
  e.preventDefault();

  if (!validate()) return;

  setState('sending');

  try {

    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: JSON.stringify({
        access_key: WEB3FORM_KEY,
        subject: "New Restaurant Inquiry — Kurokaa",
        from_name: form.name,
        name: form.name,
        email: form.email,
        restaurant: form.restaurant,
        role: form.role,
        size: form.size,
        message: form.message
      })
    });

    const result = await response.json();

    if (result.success) {
      setState('sent');
    } else {
      alert("Something went wrong.");
      setState('idle');
    }

  } catch (error) {
    alert("Network error.");
    setState('idle');
  }
};

  return (
    <section className="scene msg-scene" id="contact">
      <div className="wrap">
        <div className="msg-grid">
          <div className="msg-left">
            <span className="eyebrow"><span className="dot" />04 — Get in Touch</span>
            <h2>Tell us about your <em>restaurant.</em></h2>
            <p>
              Kurokaa is live. If you run a kitchen — or are about to — we'd love to hear from you.
              The more specific you are about where the operation hurts, the better the conversation.
            </p>
            <div className="quote">
              "The owner shouldn't be the integration layer.
              That's the whole reason we built this."
              <span className="who">Abhishek Bose · Founder</span>
            </div>
          </div>

          <div>
            {state === 'sent' ?
            <div className="form-success">
                <div className="check"><Icon name="check" size={22} /></div>
                <h3>Message <em>received.</em></h3>
                <p>Thanks, {form.name.split(' ')[0]}. We'll write back within two business days — usually faster.</p>
              </div> :

            <form className="form-card" onSubmit={submit} noValidate>
                <div className="form-row">
                  <div className={`field ${errors.name ? 'err' : ''}`}>
                    <label htmlFor="f-name">Your name</label>
                    <input id="f-name" type="text" value={form.name} onChange={(e) => set('name', e.target.value)} placeholder="Abhishek Bose" />
                    {errors.name && <div className="err-msg">{errors.name}</div>}
                  </div>
                  <div className={`field ${errors.email ? 'err' : ''}`}>
                    <label htmlFor="f-email">Email</label>
                    <input id="f-email" type="email" value={form.email} onChange={(e) => set('email', e.target.value)} placeholder="you@your-restaurant.com" />
                    {errors.email && <div className="err-msg">{errors.email}</div>}
                  </div>
                </div>

                <div className="form-row">
                  <div className="field">
                    <label htmlFor="f-rest">Restaurant / Group <span style={{ color: 'var(--ink-mute)' }}>(optional)</span></label>
                    <input id="f-rest" type="text" value={form.restaurant} onChange={(e) => set('restaurant', e.target.value)} placeholder="e.g. Park Plaza, Pan-Asian" />
                  </div>
                  <div className="field">
                    <label htmlFor="f-size">Operation size</label>
                    <select id="f-size" value={form.size} onChange={(e) => set('size', e.target.value)}>
                      {SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>

                <div className="field">
                  <label>You are a…</label>
                  <div className="role-chips" role="radiogroup">
                    {ROLES.map((r) =>
                  <button
                    key={r}
                    type="button"
                    role="radio"
                    aria-checked={form.role === r}
                    className="chip"
                    data-on={form.role === r}
                    onClick={() => set('role', r)}>
                    
                        {r}
                      </button>
                  )}
                  </div>
                </div>

                <div className={`field ${errors.message ? 'err' : ''}`}>
                  <label htmlFor="f-msg">
                    What should we know?
                    <span className="count">{form.message.length} / 600</span>
                  </label>
                  <textarea
                  id="f-msg"
                  value={form.message}
                  onChange={(e) => set('message', e.target.value.slice(0, 600))}
                  placeholder="The shift where everything broke. The metric you can't get to. The vacation you haven't taken. Any of it." />
                
                  {errors.message ?
                <div className="err-msg">{errors.message}</div> :
                <div className="hint">We read every message. No CRM auto-responder, we promise.</div>}
                </div>

                <div className="submit-row">
                  <div className="privacy">By submitting you agree we may write back. We don't sell data, ever.</div>
                  <button className="submit-btn" type="submit" disabled={state === 'sending'}>
                    {state === 'sending' ? 'Sending…' : 'Send message'}
                    <Icon name="arrow" size={14} />
                  </button>
                </div>
              </form>
            }
          </div>
        </div>
      </div>
    </section>);

}

/* ============================ Root ============================ */
function App() {
  const [active, setActive] = useState('');

  useEffect(() => {
    const ids = NAV.map((n) => n.id);
    const onScroll = () => {
      const y = window.scrollY + 100;
      let cur = '';
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) cur = id;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <>
      <Nav active={active} />
      <Hero />
      <Story />
      <Why />
      <What />
      <MessageCapture />
      <Footer />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
