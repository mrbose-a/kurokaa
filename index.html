<style>
  :root {
    /* Surface hierarchy: dark navy, deepest to most elevated */
    --color-canvas:   #0b1420;
    --color-surface:  #0f1923;
    --color-raised:   #162130;
    --color-high:     #1d2d3e;
    --color-line:     #243040;

    /* Brand */
    --color-brand:    #c9a84c;

    /* Semantic status */
    --color-success:  #22c55e;
    --color-warning:  #f59e0b;
    --color-danger:   #ef4444;
    --color-info:     #3b82f6;

    /* Text hierarchy */
    --color-ink:      #f1f5f9;
    --color-dim:      #94a3b8;
    --color-ghost:    #475569;

    /* aliases: kept so existing rules below read the same, now pointed at the dark palette */
    --paper: var(--color-canvas);
    --paper-2: var(--color-surface);
    --paper-3: var(--color-raised);
    --ink: var(--color-ink);
    --ink-soft: var(--color-dim);
    --ink-mute: var(--color-ghost);
    --rule: var(--color-line);
    --rule-strong: color-mix(in oklch, var(--color-line) 55%, var(--color-ink));
    --gold: var(--color-brand);
    --gold-2: var(--color-brand);
    --gold-soft: rgba(201,168,76,0.15);
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMjAnIGhlaWdodD0nMjIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAuMTggIDAgMCAwIDAgMC4xMiAgMCAwIDAgMCAwLjA1ICAwIDAgMCAwLjA2IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");
    opacity: 0.35;
    mix-blend-mode: overlay;
    z-index: 1;
  }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 48px; position: relative; z-index: 2; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eyebrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-1px);
  }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklch, var(--paper) 88%, transparent);
    backdrop-filter: saturate(120%) blur(8px);
    -webkit-backdrop-filter: saturate(120%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }

  .nav-links { display: flex; gap: 28px; }
  .nav-link {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    background: none; border: 0; padding: 0;
    transition: color .2s ease;
  }
  .nav-link:hover, .nav-link[data-active="true"] { color: var(--ink); }
  .nav-link[data-active="true"] .num { color: var(--gold); }
  .nav-link .num { color: var(--ink-mute); margin-right: 8px; }
  @media (max-width: 820px) { .nav-links { display: none; } }
  @media (max-width: 480px) {
    .brand img { height: 16px !important; }
    .nav-actions { gap: 10px; }
    .nav-cta { padding: 8px 12px; font-size: 10px; }
    .nav-signin { font-size: 10px; }
  }

  .nav-actions { display: flex; align-items: center; gap: 18px; }
  .nav-signin {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    transition: color .2s ease;
  }
  .nav-signin:hover { color: var(--gold); }
  .nav-cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-canvas);
    background: var(--color-brand);
    border: 0;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .2s ease, filter .2s ease;
  }
  .nav-cta:hover { filter: brightness(1.08); transform: translateY(-1px); }

  /* HERO */
  .hero { position: relative; padding: 96px 0 80px; }
  .hero-spotlight {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px 320px at var(--mx, 50%) var(--my, 35%), rgba(201,168,76,0.14), transparent 70%);
    transition: background .2s ease;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 80px;
    align-items: start;
  }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }

  .hero h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(52px, 8.2vw, 124px);
    line-height: 0.94;
    letter-spacing: -0.02em;
    margin: 22px 0 0;
    color: var(--ink);
  }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero .lede {
    font-family: var(--serif);
    font-size: clamp(20px, 1.9vw, 26px);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 50ch;
    margin: 28px 0 0;
  }

  .hero-ctas {
    margin-top: 40px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 16px 26px;
    border-radius: 8px;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease, filter .2s ease;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--color-brand); color: var(--color-canvas); }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn-ghost-light { background: transparent; color: var(--color-ink); border-color: rgba(241,245,249,0.35); }
  .btn-ghost-light:hover { background: var(--color-ink); color: var(--color-canvas); border-color: var(--color-ink); }

  .hero-reassure {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
  }

  /* Operational recommendations card */
  .ops-card {
    border: 1px solid var(--rule-strong);
    background: var(--color-raised);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .ops-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule);
    background: var(--color-high);
  }
  .ops-head .left { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
  .ops-head .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--color-success);
    box-shadow: 0 0 0 4px rgba(34,197,94,0.18);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(34,197,94,0.18); }
    50% { box-shadow: 0 0 0 7px rgba(34,197,94,0.06); }
  }
  .ops-head .time { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

  .ops-list { padding: 6px 0; }
  .ops-item {
    display: grid; grid-template-columns: 28px 1fr;
    gap: 14px;
    padding: 18px 20px;
    border-top: 1px solid var(--rule);
    transition: background .25s ease;
  }
  .ops-item:first-child { border-top: 0; }
  .ops-item[data-fresh="true"] {
    background: var(--gold-soft);
    animation: fade-in 0.7s ease;
  }
  @keyframes fade-in {
    from { background: rgba(201,168,76,0.28); opacity: 0.4; transform: translateY(-2px); }
    to   { background: var(--gold-soft); opacity: 1; transform: none; }
  }
  .ops-arr {
    font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; color: var(--gold);
    padding-top: 2px;
  }
  .ops-body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.35;
    color: var(--ink);
  }
  .ops-body b { font-weight: 500; color: var(--ink); }
  .ops-body .why {
    display: block; margin-top: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-mute);
  }

  .ops-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-top: 1px solid var(--rule);
    background: var(--color-canvas);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute);
  }
  .ops-foot .since { color: var(--ink-soft); }

  .hero-foot {
    margin-top: 96px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
  }
  @media (max-width: 720px) { .hero-foot { grid-template-columns: repeat(2, 1fr); } }
  .signal {
    display: flex; flex-direction: column; gap: 6px;
  }
  .signal .v { font-family: var(--serif); font-size: 38px; line-height: 1; letter-spacing: -0.01em; }
  .signal .v em { color: var(--gold); font-style: italic; }
  .signal .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }

  /* generic section */
  section.scene { padding: 130px 0; position: relative; }
  section.scene + section.scene { border-top: 1px solid var(--rule); }

  .section-head {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px;
    margin-bottom: 72px;
    align-items: end;
  }
  @media (max-width: 980px) { .section-head { grid-template-columns: 1fr; gap: 24px; } }
  .section-head .left .eyebrow { display: block; margin-bottom: 14px; }
  .section-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(46px, 5.6vw, 88px);
    line-height: 0.96;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .section-head h2 em { font-style: italic; color: var(--gold); }
  .section-head .right p {
    font-family: var(--serif);
    font-size: clamp(20px, 1.6vw, 24px);
    line-height: 1.4;
    color: var(--ink-soft);
    margin: 0;
  }

  /* DEMO SECTION — one business day walkthrough, directly below the hero */
  .demo-scene { background: var(--paper); border-top: 1px solid var(--rule); padding: 96px 0 112px; }
  .demo-scene .wrap { display: flex; flex-direction: column; align-items: center; gap: 56px; }
  .btn-sm { padding: 10px 20px; }

  /* reuse the site's shared .section-head (see PROBLEMS) instead of a one-off
     centered intro, so this section's header matches every other scene
     exactly — same width, same left edge, same type treatment. */
  .demo-scene .section-head { width: 100%; margin-bottom: 0; }

  /* desktop: rail + crossfading frame */
  .demo-layout { width: 100%; display: flex; gap: 32px; align-items: flex-start; }
  .demo-rail { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
  .demo-rail-item {
    position: relative; display: block; width: 100%; text-align: left;
    background: none; border: 0; border-left: 3px solid transparent; font: inherit; color: inherit;
    cursor: pointer; padding: 16px 18px 20px; border-radius: 12px; transition: background 150ms ease;
  }
  .demo-rail-item[data-active="true"] { border-left-color: var(--gold); background: var(--paper-3); }
  .demo-rail-item .row { display: flex; align-items: baseline; gap: 10px; }
  .demo-rail-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
  .demo-rail-item[data-active="true"] .demo-rail-num { color: var(--gold); }
  .demo-rail-title { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .demo-rail-item[data-active="true"] .demo-rail-title { color: var(--ink); }
  .demo-rail-caption { margin: 6px 0 0; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--ink-mute); }
  .demo-rail-item[data-active="true"] .demo-rail-caption { color: var(--ink-soft); }
  .demo-rail-progress-track {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 2px;
    background: var(--rule); border-radius: 0 0 12px 12px; overflow: hidden;
  }
  .demo-rail-progress-fill { height: 100%; background: var(--gold); width: 0%; animation: railProgress 4000ms linear forwards; }
  @keyframes railProgress { from { width: 0%; } to { width: 100%; } }

  .demo-frame-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .demo-frame-viewport {
    background: var(--paper-3); border: 1px solid var(--rule-strong); border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35); height: 600px; position: relative; min-height: 0;
  }
  .demo-frame {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 220ms ease;
  }
  .demo-frame[data-active="true"] { opacity: 1; pointer-events: auto; }
  .demo-frame-caption {
    margin: 0; text-align: center; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft);
  }

  /* iPad-style bezel around real product screenshots */
  .demo-ipad {
    position: relative; width: min(92%, 640px); aspect-ratio: 4 / 3; background: #000;
    border-radius: 22px; padding: 14px 14px 14px 24px; margin: auto;
    box-shadow: 0 16px 44px rgba(0,0,0,0.5), inset 0 0 0 1px #2a2a2a;
  }
  .demo-ipad-sm {
    width: min(96%, 420px); border-radius: 18px; padding: 10px 10px 10px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px #2a2a2a;
  }
  .demo-ipad-cam { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%; background: #222; }
  .demo-ipad-sm .demo-ipad-cam { left: 6px; width: 5px; height: 5px; }
  .demo-ipad-img {
    width: 100%; height: 100%; background: #000; background-size: contain;
    background-position: center; background-repeat: no-repeat; border-radius: 8px;
  }

  /* intelligence beat card — reuses .ops-card / .ops-item / .ops-foot from the hero */
  .demo-intel-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; max-height: 100%; overflow: auto; padding: 8px; }
  .demo-intel-card { width: 460px; max-width: 100%; }
  .demo-intel-body { padding: 20px 22px 4px; }
  .demo-badge {
    display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 4px;
    font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
    background: rgba(239,68,68,0.1); color: var(--color-danger); border: 1px solid rgba(239,68,68,0.25);
  }
  .demo-intel-title { margin: 10px 0 6px; font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--ink); }
  .demo-intel-desc { margin: 0 0 14px; font-family: var(--sans); font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
  .demo-intel-rec { padding: 16px 22px; background: rgba(201,168,76,0.15); }
  .demo-intel-card .ops-arr { font-size: 22px; }
  .demo-intel-card .ops-body { font-size: 17px; }
  .demo-intel-card .ops-foot { padding: 12px 22px; }

  .demo-intel-card-sm { width: 320px; max-width: 100%; }
  .demo-intel-card-sm .demo-intel-body { padding: 14px 16px 2px; }
  .demo-intel-card-sm .demo-badge { font-size: 9px; padding: 3px 8px; }
  .demo-intel-card-sm .demo-intel-title { font-size: 16px; margin: 8px 0 5px; }
  .demo-intel-card-sm .demo-intel-desc { font-size: 11px; margin: 0 0 12px; }
  .demo-intel-card-sm .demo-intel-rec { grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 16px; }
  .demo-intel-card-sm .ops-arr { font-size: 16px; }
  .demo-intel-card-sm .ops-body { font-size: 13px; }
  .demo-intel-card-sm .ops-body .why { font-size: 8px; }
  .demo-intel-card-sm .ops-foot { padding: 10px 16px; font-size: 9px; }

  .demo-intel-controls { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .demo-intel-controls-sm { gap: 8px; }
  .demo-approve-btn { transition: transform 150ms ease, filter 150ms ease; }
  .demo-approve-btn[data-stage="pressed"], .demo-approve-btn[data-stage="approved"] { transform: scale(0.96); filter: brightness(0.92); }
  .demo-approved-badge {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--color-success); background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25);
    border-radius: 6px; padding: 5px 12px; animation: fadeUp 300ms ease;
  }
  .demo-approved-badge-sm { font-size: 10px; padding: 4px 10px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* mobile: scroll-snap slider */
  .demo-mobile { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px; }
  .demo-mobile-track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 12px;
    border: 1px solid var(--rule-strong); background: var(--paper-3); box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .demo-mobile-slide { flex: 0 0 100%; scroll-snap-align: center; height: 360px; display: flex; flex-direction: column; }
  .demo-mobile-slide-inner {
    flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center;
    padding: 14px; overflow: hidden;
  }
  .demo-mobile-dots { display: flex; justify-content: center; gap: 8px; }
  .demo-mobile-dot { width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: var(--rule); }
  .demo-mobile-dot[data-active="true"] { background: var(--gold); }
  .demo-mobile-caption { text-align: center; }
  .demo-mobile-caption .title { margin: 0 0 4px; font-family: var(--sans); font-weight: 500; font-size: 14px; color: var(--ink); }
  .demo-mobile-caption p { margin: 0; font-family: var(--sans); font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  .demo-cta { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .demo-cta-note { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
  .demo-cta-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  /* PROBLEMS */
  .problems-scene { background: var(--paper-2); }
  .problems-list { display: flex; flex-direction: column; }
  .problem-item {
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
    align-items: center;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }
  .problem-item:last-child { border-bottom: 0; }
  @media (max-width: 820px) { .problem-item { grid-template-columns: 1fr; gap: 10px; } }
  .problem-q { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.3; color: var(--ink-soft); }
  .problem-a { font-family: var(--serif); font-size: 22px; line-height: 1.3; color: var(--ink); display: flex; gap: 12px; align-items: baseline; }
  .problem-a .arr { color: var(--gold); font-style: italic; font-size: 22px; flex-shrink: 0; }

  /* DINNER RUSH */
  .rush-scene { background: var(--color-surface); color: var(--color-ink); overflow: hidden; }
  .rush-scene::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(900px 460px at 8% -10%, rgba(201,168,76,0.18), transparent 60%),
      radial-gradient(700px 320px at 100% 110%, rgba(201,168,76,0.10), transparent 60%);
    pointer-events: none;
  }
  .rush-scene .eyebrow { color: var(--gold-2); }
  .rush-scene h2 { color: var(--color-ink); }
  .rush-scene .section-head .right p { color: color-mix(in oklch, var(--color-ink) 75%, transparent); }

  .rush-stage {
    position: relative; z-index: 2;
    border: 1px solid rgba(241,245,249,0.16);
    background: rgba(241,245,249,0.03);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .rush-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid rgba(241,245,249,0.12);
    background: rgba(11,20,32,0.4);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: color-mix(in oklch, var(--color-ink) 70%, transparent);
  }
  .rush-meta .when { display: flex; gap: 18px; align-items: center; }
  .rush-meta .pressure {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--gold-2);
  }
  .rush-meta .pressure .bar {
    display: inline-block; width: 90px; height: 6px;
    background: rgba(241,245,249,0.12);
    border-radius: 3px; overflow: hidden;
  }
  .rush-meta .pressure .bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--gold-2), var(--color-danger));
    transition: width .6s ease;
  }

  .rush-cols {
    display: grid;
    grid-template-columns: 1.1fr auto 1fr auto 1.1fr;
    gap: 0;
  }
  @media (max-width: 980px) { .rush-cols { grid-template-columns: 1fr; } }
  .rush-col { padding: 28px 26px 32px; }
  .rush-col + .rush-col { border-left: 1px solid rgba(241,245,249,0.10); }
  @media (max-width: 980px) {
    .rush-col + .rush-col { border-left: 0; border-top: 1px solid rgba(241,245,249,0.10); }
    .rush-sep { display: none; }
  }
  .rush-sep {
    display: grid; place-items: center;
    color: color-mix(in oklch, var(--color-ink) 40%, transparent);
    padding: 0 6px;
    border-left: 1px solid rgba(241,245,249,0.10);
    border-right: 1px solid rgba(241,245,249,0.10);
  }
  .rush-sep svg { width: 22px; height: 22px; }

  .rush-col h4 {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-2);
    margin: 0 0 18px;
    font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .rush-col h4 .num { color: color-mix(in oklch, var(--color-ink) 40%, transparent); }

  .signals-list { display: flex; flex-direction: column; gap: 14px; }
  .signal-line {
    display: grid; grid-template-columns: 56px 1fr auto;
    align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed rgba(241,245,249,0.10);
    font-family: var(--sans); font-size: 14px;
    color: color-mix(in oklch, var(--color-ink) 88%, transparent);
  }
  .signal-line:last-child { border-bottom: 0; }
  .signal-line .src {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: color-mix(in oklch, var(--color-ink) 50%, transparent);
  }
  .signal-line .lvl {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid rgba(241,245,249,0.20);
    color: color-mix(in oklch, var(--color-ink) 80%, transparent);
  }
  .signal-line .lvl.hot { border-color: rgba(239,68,68,0.5); color: #f8a8a8; background: rgba(239,68,68,0.1); }
  .signal-line .lvl.warm { border-color: rgba(245,158,11,0.5); color: var(--color-warning); background: rgba(245,158,11,0.1); }

  .interp-list { display: flex; flex-direction: column; gap: 16px; }
  .interp {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.4;
    color: color-mix(in oklch, var(--color-ink) 92%, transparent);
    padding-left: 14px;
    border-left: 2px solid var(--gold);
  }
  .interp em { font-style: italic; color: var(--gold-2); }

  .calls-list { display: flex; flex-direction: column; gap: 14px; }
  .call {
    display: grid; grid-template-columns: 20px 1fr;
    gap: 12px; align-items: start;
    padding: 14px 16px;
    background: rgba(241,245,249,0.04);
    border: 1px solid rgba(241,245,249,0.10);
    border-radius: 6px;
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .call:hover { background: rgba(201,168,76,0.10); border-color: rgba(201,168,76,0.4); transform: translateX(2px); }
  .call .arr { color: var(--gold-2); font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; }
  .call .body { font-family: var(--serif); font-size: 19px; line-height: 1.3; color: var(--color-ink); }
  .call .meta {
    margin-top: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: color-mix(in oklch, var(--color-ink) 55%, transparent);
  }

  .rush-foot {
    padding: 18px 24px;
    border-top: 1px solid rgba(241,245,249,0.12);
    background: rgba(11,20,32,0.3);
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: color-mix(in oklch, var(--color-ink) 60%, transparent);
  }
  .rush-foot .scenarios { display: flex; gap: 6px; }
  .rush-foot .sc-dot {
    width: 26px; height: 4px; border-radius: 2px; background: rgba(241,245,249,0.18);
    cursor: pointer; border: 0; padding: 0;
    transition: background .25s ease;
  }
  .rush-foot .sc-dot[data-on="true"] { background: var(--gold-2); }

  /* NERVOUS SYSTEM (why this works) */
  .ns-scene { background: var(--paper); }
  .ns-moments {
    display: flex; flex-direction: column;
    border-top: 1px solid var(--rule);
    max-width: 62ch;
  }
  .ns-moment {
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
    font-family: var(--serif); font-style: italic;
    font-size: 19px; line-height: 1.35;
    color: var(--ink-soft);
  }
  .ns-moment:last-child { border-bottom: 0; }

  /* REAL SERVICE */
  .rs-scene { background: var(--paper-2); }
  .rs-grid {
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px;
    align-items: start;
  }
  @media (max-width: 980px) { .rs-grid { grid-template-columns: 1fr; gap: 48px; } }
  .rs-copy {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.5;
    color: var(--ink);
  }
  .rs-copy p { margin: 0 0 22px; }
  .rs-copy em { font-style: italic; color: var(--gold); }
  .rs-copy .close {
    margin-top: 36px; padding-top: 26px;
    border-top: 1px solid var(--rule-strong);
    font-style: italic;
    font-size: 24px;
    color: var(--ink);
  }
  .rs-copy .close em { color: var(--gold); }

  .moments {
    display: flex; flex-direction: column;
    border-top: 1px solid var(--rule-strong);
  }
  .moment {
    display: grid; grid-template-columns: 72px 1fr auto;
    align-items: center; gap: 18px;
    padding: 20px 8px;
    border-bottom: 1px solid var(--rule);
    transition: background .25s ease, padding .25s ease;
  }
  .moment:hover { background: var(--color-raised); padding-left: 20px; }
  .moment .t {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .moment .text {
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.3;
    color: var(--ink);
  }
  .moment .text em { font-style: italic; color: var(--gold); }
  .moment .pos {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  @media (max-width: 640px) {
    .moment { grid-template-columns: 1fr; gap: 6px; }
    .moment .pos { display: none; }
  }

  /* STORY */
  .story-layout { display: grid; grid-template-columns: 1fr 1.1fr; gap: 80px; align-items: start; }
  @media (max-width: 980px) { .story-layout { grid-template-columns: 1fr; gap: 48px; } }

  .story-figure {
    border: 1px solid var(--rule-strong);
    background: linear-gradient(180deg, var(--paper-2), var(--paper-3));
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .story-figure .figure-tag {
    position: relative; z-index: 2;
    padding: 22px 24px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .story-figure .figure-cap {
    position: relative; z-index: 2;
    padding: 24px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
  }
  .story-figure .figure-glyph {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: var(--serif); font-style: italic;
    font-size: clamp(90px, 14vw, 180px);
    color: var(--ink);
    opacity: 0.9;
    z-index: 1;
  }
  .story-figure .figure-glyph .acc { color: var(--gold); }

  .story-copy { font-family: var(--serif); font-size: 22px; line-height: 1.55; color: var(--ink); }
  .story-copy .dropcap::first-letter {
    font-family: var(--serif);
    font-size: 5em;
    line-height: 0.82;
    float: left;
    padding: 6px 14px 0 0;
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
  }
  .story-copy p + p { margin-top: 22px; }
  .story-copy em { color: var(--gold); font-style: italic; }

  .story-meta {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex; gap: 32px; flex-wrap: wrap;
  }
  .story-meta .kv { display: flex; flex-direction: column; gap: 4px; }
  .story-meta .kv .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }
  .story-meta .kv .v { font-family: var(--sans); font-size: 15px; color: var(--ink); }

  /* CLOSING CTA */
  .close-scene { background: var(--color-high); color: var(--color-ink); padding: 140px 0 130px; position: relative; overflow: hidden; }
  .close-scene::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(800px 380px at 50% -10%, rgba(201,168,76,0.18), transparent 60%),
      radial-gradient(600px 260px at 0% 110%, rgba(201,168,76,0.10), transparent 60%);
    pointer-events: none;
  }
  .close-inner { position: relative; z-index: 2; text-align: center; max-width: 920px; margin: 0 auto; }
  .close-eye { color: var(--gold-2); }
  .close-inner h2 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(56px, 7.4vw, 116px);
    line-height: 0.96; letter-spacing: -0.02em;
    margin: 22px 0 0;
    color: var(--color-ink);
  }
  .close-inner h2 em { font-style: italic; color: var(--gold-2); }
  .close-inner p.lede {
    font-family: var(--serif);
    font-size: clamp(20px, 1.8vw, 26px);
    line-height: 1.45;
    color: color-mix(in oklch, var(--color-ink) 80%, transparent);
    margin: 30px auto 0;
    max-width: 38ch;
  }
  .close-inner p.lede em { color: var(--gold-2); font-style: italic; }
  .close-ctas {
    margin-top: 44px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
  }
  .close-reassure {
    margin-top: 22px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: color-mix(in oklch, var(--color-ink) 55%, transparent);
  }

  /* FOOTER */
  footer.foot {
    background: var(--color-canvas);
    color: color-mix(in oklch, var(--color-ink) 75%, transparent);
    padding: 56px 0 36px;
    position: relative;
    z-index: 2;
    border-top: 1px solid var(--rule);
  }
  .foot-top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 48px; }
  @media (max-width: 720px) { .foot-top { grid-template-columns: 1fr; gap: 32px; } }
  .foot h4 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in oklch, var(--color-ink) 55%, transparent); margin: 0 0 14px; font-weight: 500; }
  .foot a { color: color-mix(in oklch, var(--color-ink) 90%, transparent); text-decoration: none; font-size: 14px; display: block; padding: 4px 0; transition: color .2s ease; }
  .foot a:hover { color: var(--gold-2); }
  .foot-brand .blurb { font-family: var(--serif); font-size: 20px; line-height: 1.4; color: color-mix(in oklch, var(--color-ink) 85%, transparent); margin: 14px 0 0; max-width: 38ch; font-style: italic; }
  .foot-bottom {
    border-top: 1px solid rgba(241,245,249,0.14);
    margin-top: 48px; padding-top: 24px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: color-mix(in oklch, var(--color-ink) 55%, transparent);
  }
  .foot-bottom .right { display: flex; gap: 18px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* FOUNDATION (what's inside) */
  .found-scene { background: var(--paper); }
  .checklist-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 28px;
    margin-bottom: 64px;
  }
  @media (max-width: 980px) { .checklist-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .checklist-grid { grid-template-columns: 1fr; } }
  .checklist-item {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 2px;
    border-bottom: 1px dashed var(--rule);
    font-family: var(--sans); font-size: 15.5px; color: var(--ink);
  }
  .check-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--gold-soft); color: var(--gold);
  }

  .found-callout {
    margin-top: 64px;
    border: 1px solid var(--gold);
    background: var(--color-high);
    border-radius: 12px;
    padding: 44px 46px;
    display: grid;
    grid-template-columns: 1.1fr 1.1fr;
    gap: 60px;
    align-items: center;
    position: relative;
  }
  .found-callout::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0;
    width: 4px; background: var(--gold);
    border-radius: 12px 0 0 12px;
  }
  @media (max-width: 980px) { .found-callout { grid-template-columns: 1fr; gap: 28px; padding: 32px 28px; } }
  .found-callout .eye-row { color: var(--gold); display: block; margin-bottom: 14px; }
  .found-callout h3 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(34px, 4vw, 50px); line-height: 1.0; letter-spacing: -0.02em;
    margin: 0;
  }
  .found-callout h3 em { color: var(--gold); font-style: italic; }
  .found-callout .sub {
    font-family: var(--serif); font-size: 19px;
    color: var(--ink-soft); margin: 16px 0 0; line-height: 1.4;
  }
  .auto-list {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 20px;
  }
  .auto-item {
    font-family: var(--sans); font-size: 14.5px; color: var(--ink);
    display: flex; align-items: center; gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .auto-item:last-child, .auto-item:nth-last-child(2) { border-bottom: 0; }
  .auto-item::before {
    content: '→';
    font-family: var(--serif); font-style: italic; color: var(--gold);
    font-size: 18px; line-height: 1;
  }

  /* PRICING */
  .pricing-scene { background: var(--paper-2); }
  .pricing-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    margin-bottom: 48px;
  }
  @media (max-width: 980px) { .pricing-layout { grid-template-columns: 1fr; } }

  .pricing-card {
    border: 1px solid var(--rule-strong);
    background: var(--color-raised);
    border-radius: 12px;
    padding: 36px 32px 40px;
    display: flex; flex-direction: column; gap: 20px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);

  .pricing-card.featured {

    border-radius: 12px 0 0 12px;
  }

  .pricing-plan-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .pricing-headline {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(36px, 4vw, 52px);
    line-height: 1.0; letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
  }
  .pricing-headline em { color: var(--gold); font-style: italic; }
  .pricing-sub {
    font-family: var(--serif); font-style: italic;
    font-size: 18px; line-height: 1.4; color: var(--ink-soft);
    margin: 0;
  }

  .pricing-amount {
    border-top: 1px solid var(--rule);

    display: flex; align-items: baseline; gap: 6px;
  }
  .price-currency {
    font-family: var(--serif); font-weight: 500;
    font-size: 28px; line-height: 1; color: var(--ink-soft);
  }
  .price-value {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(64px, 7vw, 88px);
    line-height: 1; letter-spacing: -0.03em; color: var(--ink);
  }
  .price-per {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--ink-mute); text-transform: uppercase;
    line-height: 1.6; align-self: flex-end; padding-bottom: 6px;
  }

  .pricing-badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .pricing-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    color: var(--ink-soft);
  }
  .pricing-badge.hi {
    border-color: var(--gold); color: var(--gold);
    background: var(--gold-soft);
  }

  .pricing-cta-area { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .pricing-footnote {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--ink-mute); line-height: 1.5;
  }

  .features-block {
    border-top: 1px solid var(--rule-strong);
    padding-top: 48px; margin-bottom: 48px;
  }
  .features-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 22px;
  }

// Same guided tour used inside app.kurokaa (Dashboard's "Watch product tour" and
// the onboarding completion step) — team access, purchases, stock adjustment,
// POS sale, kitchen display, 86 board, dashboard. Loads Supademo's embed script
// on demand; the popup is a self-contained overlay appended to document.body.
const SUPADEMO_SRC = 'https://script.supademo.com/supademo.js';
const PRODUCT_TOUR_ID = 'cmrf2zt6g03xxqmb22tkn85bq';

function loadSupademoScript() {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${SUPADEMO_SRC}"]`)) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = SUPADEMO_SRC;
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Failed to load Supademo script'));
    document.body.appendChild(script);
  });
}

async function openProductTour() {
  try {
    await loadSupademoScript();
    window.Supademo && window.Supademo.open(PRODUCT_TOUR_ID);
  } catch {
    // Non-critical — the rest of the page is still fully usable without the tour
  }
}

function DemoSection() {
  const [activeBeat, setActiveBeatState] = useState(0);
  const [paused, setPaused] = useState(false);
  const [approveStage, setApproveStage] = useState('idle');
  const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' && window.innerWidth < 768);

  const activeBeatRef = useRef(0);
  const elapsedRef = useRef(0);
  const pausedAtRef = useRef(null);
  const timerRef = useRef(null);
  const approveTimer1Ref = useRef(null);
  const approveTimer2Ref = useRef(null);
  const sliderRef = useRef(null);

  const setActiveBeat = (i) => {
    const enteringIntel = i === 3 && activeBeatRef.current !== 3;
    const leavingIntel = activeBeatRef.current === 3 && i !== 3;
    clearTimeout(approveTimer1Ref.current);
    clearTimeout(approveTimer2Ref.current);
    activeBeatRef.current = i;
    setActiveBeatState(i);
    if (enteringIntel || leavingIntel) setApproveStage('idle');
    if (enteringIntel) {
      approveTimer1Ref.current = setTimeout(() => {
        setApproveStage('pressed');
        approveTimer2Ref.current = setTimeout(() => setApproveStage('approved'), 350);
      }, 1500);
    }
  };

  // No-op on desktop (sliderRef only mounts in the mobile track) — safe to
  // call unconditionally from both manual navigation and the auto-advance timer.
  const scrollSliderTo = (i) => {
    if (sliderRef.current) {
      sliderRef.current.scrollTo({ left: i * sliderRef.current.clientWidth, behavior: 'smooth' });
    }
  };

  const scheduleTimer = (ms) => {
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      elapsedRef.current = 0;
      const next = (activeBeatRef.current + 1) % DEMO_BEATS.length;
      setActiveBeat(next);
      scrollSliderTo(next);
      scheduleTimer(DEMO_BEAT_MS);
    }, ms);
  };

  useEffect(() => {
    scheduleTimer(DEMO_BEAT_MS);
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => {
      clearTimeout(timerRef.current);
      clearTimeout(approveTimer1Ref.current);
      clearTimeout(approveTimer2Ref.current);
      window.removeEventListener('resize', onResize);
    };
  }, []);

  const goToBeat = (i) => {
    elapsedRef.current = 0;
    pausedAtRef.current = null;
    setActiveBeat(i);
    if (!paused) scheduleTimer(DEMO_BEAT_MS);
    scrollSliderTo(i);
  };

  const onPause = () => {
    if (pausedAtRef.current !== null) return;
    pausedAtRef.current = Date.now();
    clearTimeout(timerRef.current);
    setPaused(true);
  };

  const onResume = () => {
    if (pausedAtRef.current === null) return;
    elapsedRef.current += Date.now() - pausedAtRef.current;
    pausedAtRef.current = null;
    setPaused(false);
    scheduleTimer(Math.max(DEMO_BEAT_MS - elapsedRef.current, 0));
  };

  const onSliderScroll = (e) => {
    const el = e.target;
    const idx = Math.round(el.scrollLeft / Math.max(el.clientWidth, 1));
    if (idx !== activeBeatRef.current && idx >= 0 && idx < DEMO_BEATS.length) {
      setActiveBeat(idx);
    }
  };

  const active = DEMO_BEATS[activeBeat];

  return (
    <section className="scene demo-scene" id="demo">
      <div className="wrap">

        <div className="section-head">
          <div className="left">
            <span className="eyebrow"><span className="dot" />One Business Day With Kurokaa</span>
            <h2>First sale to <em>clean close.</em></h2>

/* ============================ Request Access (message capture) ============================ */
const ROLES = ['Owner', 'Operator', 'Chef', 'Investor', 'Press', 'Curious'];
const SIZES = ['1 outlet', '2–4 outlets', '5–10 outlets', '10+ outlets', 'Pre-opening'];

function MessageCapture() {
  const [form, setForm] = useState({ name: '', email: '', restaurant: '', role: 'Owner', size: '2–4 outlets', message: '' });
  const [errors, setErrors] = useState({});
  const [state, setState] = useState('idle');

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Tell us what to call you.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'A real email, please.';
    if (!form.message.trim() || form.message.trim().length < 12) e.message = 'A sentence or two — what should we know?';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!validate()) return;
    setState('sending');
    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          access_key: WEB3FORM_KEY,
          subject: "New Restaurant Inquiry — Kurokaa",
          from_name: form.name,
          name: form.name,
          email: form.email,
          restaurant: form.restaurant,
          role: form.role,
          size: form.size,
          message: form.message
        })
      });
      const result = await response.json();
      if (result.success) {
        setState('sent');
      } else {
        setState('idle');
        alert("Something went wrong. Please try again.");
      }
    } catch {
      setState('idle');
      alert("Network error. Please try again.");
    }
  };

  return (
    <section className="scene msg-scene" id="contact">
      <div className="wrap">
        <div className="msg-grid">
          <div className="msg-left">
            <span className="eyebrow"><span className="dot" />Request Access</span>
            <h2>Tell us about your <em>restaurant.</em></h2>
            <p>
              We're hand-picking the first cohort. If you run a kitchen &mdash; or are about to &mdash; we'd like to hear from you.
              The more specific you are about where the operation hurts, the better the conversation.
            </p>
            <div className="quote">
              "The owner shouldn't be the integration layer.
              That's the whole reason we built this."
              <span className="who">Abhishek Bose &middot; Founder</span>
            </div>
          </div>

          <div>
            {state === 'sent' ? (
              <div className="form-success">
                <div className="check"><Icon name="check" size={22} /></div>
                <h3>Message <em>received.</em></h3>
                <p>Thanks, {form.name.split(' ')[0]}. We'll write back within two business days &mdash; usually faster.</p>
              </div>
            ) : (
              <form className="form-card" onSubmit={submit} noValidate>
                <div className="form-row">
                  <div className={`field ${errors.name ? 'err' : ''}`}>
                    <label htmlFor="f-name">Your name</label>
                    <input id="f-name" type="text" value={form.name} onChange={(e) => set('name', e.target.value)} placeholder="Abhishek Bose" />
                    {errors.name && <div className="err-msg">{errors.name}</div>}
                  </div>
                  <div className={`field ${errors.email ? 'err' : ''}`}>
                    <label htmlFor="f-email">Email</label>
                    <input id="f-email" type="email" value={form.email} onChange={(e) => set('email', e.target.value)} placeholder="you@your-restaurant.com" />
                    {errors.email && <div className="err-msg">{errors.email}</div>}
                  </div>
                </div>

                <div className="form-row">
                  <div className="field">
                    <label htmlFor="f-rest">Restaurant / Group <span style={{ color: 'var(--ink-mute)' }}>(optional)</span></label>
                    <input id="f-rest" type="text" value={form.restaurant} onChange={(e) => set('restaurant', e.target.value)} placeholder="e.g. Park Plaza, Pan-Asian" />
                  </div>
                  <div className="field">
                    <label htmlFor="f-size">Operation size</label>
                    <select id="f-size" value={form.size} onChange={(e) => set('size', e.target.value)}>
                      {SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>

                <div className="field">
                  <label>You are a&hellip;</label>
                  <div className="role-chips" role="radiogroup">
                    {ROLES.map((r) => (
                      <button
                        key={r}
                        type="button"
                        role="radio"
                        aria-checked={form.role === r}
                        className="chip"
                        data-on={form.role === r}
                        onClick={() => set('role', r)}>
                        {r}
                      </button>
                    ))}
                  </div>
                </div>

                <div className={`field ${errors.message ? 'err' : ''}`}>
                  <label htmlFor="f-msg">
                    What should we know?
                    <span className="count">{form.message.length} / 600</span>
                  </label>
                  <textarea
                    id="f-msg"
                    value={form.message}
                    onChange={(e) => set('message', e.target.value.slice(0, 600))}
                    placeholder="The shift where everything broke. The metric you can't get to. The vacation you haven't taken. Any of it." />
                  {errors.message
                    ? <div className="err-msg">{errors.message}</div>
                    : <div className="hint">We read every message. No CRM auto-responder, we promise.</div>}
                </div>

                <div className="submit-row">
                  <div className="privacy">By submitting you agree we may write back. We don't sell data, ever.</div>
                  <button className="submit-btn" type="submit" disabled={state === 'sending'}>
                    {state === 'sending' ? 'Sending…' : 'Send message'}
                    <Icon name="arrow" size={14} />
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================ App ============================ */
function App() {
  const [active, setActive] = useState('');

  useEffect(() => {
    const ids = NAV.map((n) => n.id);
    const onScroll = () => {
      const y = window.scrollY + 120;
      let cur = '';
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) cur = id;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <>
      <Nav active={active} />
      <Hero />
      <DemoSection />
      <Problems />
      <Foundation />
      <DinnerRush />
      <NervousSystem />
      <RealService />
      <Story />
      <Pricing />
      <MessageCapture />
      <ClosingCTA />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
