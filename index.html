<style>
  :root {
    --paper: #F6F1E6;
    --paper-2: #EFE9DA;
    --paper-3: #E6DFCD;
    --ink: #0A0F22;
    --ink-2: #1B2038;
    --ink-soft: #4B4E63;
    --ink-mute: #7D7C87;
    --rule: #2E2A1F1A;
    --rule-strong: #2E2A1F33;
    --gold: #B07A22;
    --gold-2: #C99659;
    --gold-soft: #B07A2222;
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMjAnIGhlaWdodD0nMjIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAuMTggIDAgMCAwIDAgMC4xMiAgMCAwIDAgMCAwLjA1ICAwIDAgMCAwLjA2IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");
    opacity: 0.55;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 48px; position: relative; z-index: 2; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eyebrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-1px);
  }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklch, var(--paper) 88%, transparent);
    backdrop-filter: saturate(120%) blur(8px);
    -webkit-backdrop-filter: saturate(120%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }

  .nav-links { display: flex; gap: 28px; }
  .nav-link {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    background: none; border: 0; padding: 0;
    transition: color .2s ease;
  }
  .nav-link:hover, .nav-link[data-active="true"] { color: var(--ink); }
  .nav-link[data-active="true"] .num { color: var(--gold); }
  .nav-link .num { color: var(--ink-mute); margin-right: 8px; }
  @media (max-width: 820px) { .nav-links { display: none; } }
  @media (max-width: 480px) {
    .brand img { height: 16px !important; }
    .nav-actions { gap: 10px; }
    .nav-cta { padding: 8px 12px; font-size: 10px; }
    .nav-signin { font-size: 10px; }
  }

  .nav-actions { display: flex; align-items: center; gap: 18px; }
  .nav-signin {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    transition: color .2s ease;
  }
  .nav-signin:hover { color: var(--gold); }
  .nav-cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .2s ease, background .2s ease;
  }
  .nav-cta:hover { background: var(--ink-2); transform: translateY(-1px); }

  /* HERO */
  .hero { position: relative; padding: 96px 0 80px; }
  .hero-spotlight {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px 320px at var(--mx, 50%) var(--my, 35%), rgba(176,122,34,0.10), transparent 70%);
    transition: background .2s ease;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 80px;
    align-items: start;
  }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }

  .hero h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(52px, 8.2vw, 124px);
    line-height: 0.94;
    letter-spacing: -0.02em;
    margin: 22px 0 0;
    color: var(--ink);
  }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero .lede {
    font-family: var(--serif);
    font-size: clamp(20px, 1.9vw, 26px);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 50ch;
    margin: 28px 0 0;
  }

  .hero-ctas {
    margin-top: 40px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 16px 26px;
    border-radius: 999px;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--gold); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn-ghost-light { background: transparent; color: var(--paper); border-color: rgba(246,241,230,0.5); }
  .btn-ghost-light:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  .hero-reassure {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
  }

  /* Operational recommendations card */
  .ops-card {
    border: 1px solid var(--rule-strong);
    background: color-mix(in oklch, var(--paper) 60%, white);
    border-radius: 6px;
    overflow: hidden;
  }
  .ops-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule);
    background: color-mix(in oklch, var(--paper) 40%, white);
  }
  .ops-head .left { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
  .ops-head .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #1F8A5B;
    box-shadow: 0 0 0 4px rgba(31,138,91,0.18);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(31,138,91,0.18); }
    50% { box-shadow: 0 0 0 7px rgba(31,138,91,0.06); }
  }
  .ops-head .time { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

  .ops-list { padding: 6px 0; }
  .ops-item {
    display: grid; grid-template-columns: 28px 1fr;
    gap: 14px;
    padding: 18px 20px;
    border-top: 1px solid var(--rule);
    transition: background .25s ease;
  }
  .ops-item:first-child { border-top: 0; }
  .ops-item[data-fresh="true"] {
    background: color-mix(in oklch, var(--gold-soft) 60%, transparent);
    animation: fade-in 0.7s ease;
  }
  @keyframes fade-in {
    from { background: color-mix(in oklch, var(--gold-soft) 100%, transparent); opacity: 0.4; transform: translateY(-2px); }
    to   { background: color-mix(in oklch, var(--gold-soft) 60%, transparent); opacity: 1; transform: none; }
  }
  .ops-arr {
    font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; color: var(--gold);
    padding-top: 2px;
  }
  .ops-body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.35;
    color: var(--ink);
  }
  .ops-body b { font-weight: 500; color: var(--ink); }
  .ops-body .why {
    display: block; margin-top: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-mute);
  }

  .ops-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-top: 1px solid var(--rule);
    background: color-mix(in oklch, var(--paper) 80%, transparent);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute);
  }
  .ops-foot .since { color: var(--ink-soft); }

  .hero-foot {
    margin-top: 96px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
  }
  @media (max-width: 720px) { .hero-foot { grid-template-columns: repeat(2, 1fr); } }
  .signal {
    display: flex; flex-direction: column; gap: 6px;
  }
  .signal .v { font-family: var(--serif); font-size: 38px; line-height: 1; letter-spacing: -0.01em; }
  .signal .v em { color: var(--gold); font-style: italic; }
  .signal .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }

  /* generic section */
  section.scene { padding: 130px 0; position: relative; }
  section.scene + section.scene { border-top: 1px solid var(--rule); }

  .section-head {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px;
    margin-bottom: 72px;
    align-items: end;
  }
  @media (max-width: 980px) { .section-head { grid-template-columns: 1fr; gap: 24px; } }
  .section-head .left .eyebrow { display: block; margin-bottom: 14px; }
  .section-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(46px, 5.6vw, 88px);
    line-height: 0.96;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .section-head h2 em { font-style: italic; color: var(--gold); }
  .section-head .right p {
    font-family: var(--serif);
    font-size: clamp(20px, 1.6vw, 24px);
    line-height: 1.4;
    color: var(--ink-soft);
    margin: 0;
  }

  /* DINNER RUSH */
  .rush-scene { background: var(--ink); color: var(--paper); overflow: hidden; }
  .rush-scene::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(900px 460px at 8% -10%, rgba(176,122,34,0.18), transparent 60%),
      radial-gradient(700px 320px at 100% 110%, rgba(176,122,34,0.10), transparent 60%);
    pointer-events: none;
  }
  .rush-scene .eyebrow { color: var(--gold-2); }
  .rush-scene h2 { color: var(--paper); }
  .rush-scene .section-head .right p { color: color-mix(in oklch, var(--paper) 75%, transparent); }

  .rush-stage {
    position: relative; z-index: 2;
    border: 1px solid rgba(246,241,230,0.16);
    background: rgba(246,241,230,0.03);
    border-radius: 6px;
    overflow: hidden;
  }
  .rush-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid rgba(246,241,230,0.12);
    background: rgba(10,15,34,0.4);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: color-mix(in oklch, var(--paper) 70%, transparent);
  }
  .rush-meta .when { display: flex; gap: 18px; align-items: center; }
  .rush-meta .pressure {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--gold-2);
  }
  .rush-meta .pressure .bar {
    display: inline-block; width: 90px; height: 6px;
    background: rgba(246,241,230,0.12);
    border-radius: 3px; overflow: hidden;
  }
  .rush-meta .pressure .bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--gold-2), #E26A4D);
    transition: width .6s ease;
  }

  .rush-cols {
    display: grid;
    grid-template-columns: 1.1fr auto 1fr auto 1.1fr;
    gap: 0;
  }
  @media (max-width: 980px) { .rush-cols { grid-template-columns: 1fr; } }
  .rush-col { padding: 28px 26px 32px; }
  .rush-col + .rush-col { border-left: 1px solid rgba(246,241,230,0.10); }
  @media (max-width: 980px) {
    .rush-col + .rush-col { border-left: 0; border-top: 1px solid rgba(246,241,230,0.10); }
    .rush-sep { display: none; }
  }
  .rush-sep {
    display: grid; place-items: center;
    color: color-mix(in oklch, var(--paper) 40%, transparent);
    padding: 0 6px;
    border-left: 1px solid rgba(246,241,230,0.10);
    border-right: 1px solid rgba(246,241,230,0.10);
  }
  .rush-sep svg { width: 22px; height: 22px; }

  .rush-col h4 {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-2);
    margin: 0 0 18px;
    font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .rush-col h4 .num { color: color-mix(in oklch, var(--paper) 40%, transparent); }

  .signals-list { display: flex; flex-direction: column; gap: 14px; }
  .signal-line {
    display: grid; grid-template-columns: 56px 1fr auto;
    align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed rgba(246,241,230,0.10);
    font-family: var(--sans); font-size: 14px;
    color: color-mix(in oklch, var(--paper) 88%, transparent);
  }
  .signal-line:last-child { border-bottom: 0; }
  .signal-line .src {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: color-mix(in oklch, var(--paper) 50%, transparent);
  }
  .signal-line .lvl {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid rgba(246,241,230,0.20);
    color: color-mix(in oklch, var(--paper) 80%, transparent);
  }
  .signal-line .lvl.hot { border-color: rgba(226,106,77,0.5); color: #F3B4A0; background: rgba(226,106,77,0.08); }
  .signal-line .lvl.warm { border-color: rgba(201,150,89,0.5); color: var(--gold-2); background: rgba(201,150,89,0.08); }

  .interp-list { display: flex; flex-direction: column; gap: 16px; }
  .interp {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.4;
    color: color-mix(in oklch, var(--paper) 92%, transparent);
    padding-left: 14px;
    border-left: 2px solid var(--gold);
  }
  .interp em { font-style: italic; color: var(--gold-2); }

  .calls-list { display: flex; flex-direction: column; gap: 14px; }
  .call {
    display: grid; grid-template-columns: 20px 1fr;
    gap: 12px; align-items: start;
    padding: 14px 16px;
    background: rgba(246,241,230,0.04);
    border: 1px solid rgba(246,241,230,0.10);
    border-radius: 4px;
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .call:hover { background: rgba(176,122,34,0.10); border-color: rgba(201,150,89,0.4); transform: translateX(2px); }
  .call .arr { color: var(--gold-2); font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; }
  .call .body { font-family: var(--serif); font-size: 19px; line-height: 1.3; color: var(--paper); }
  .call .meta {
    margin-top: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: color-mix(in oklch, var(--paper) 55%, transparent);
  }

  .rush-foot {
    padding: 18px 24px;
    border-top: 1px solid rgba(246,241,230,0.12);
    background: rgba(10,15,34,0.3);
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: color-mix(in oklch, var(--paper) 60%, transparent);
  }
  .rush-foot .scenarios { display: flex; gap: 6px; }
  .rush-foot .sc-dot {
    width: 26px; height: 4px; border-radius: 2px; background: rgba(246,241,230,0.18);
    cursor: pointer; border: 0; padding: 0;
    transition: background .25s ease;
  }
  .rush-foot .sc-dot[data-on="true"] { background: var(--gold-2); }

  /* NERVOUS SYSTEM */
  .ns-scene { background: var(--paper); }
  .ns-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    position: relative;
  }
  @media (max-width: 980px) { .ns-grid { grid-template-columns: 1fr; } }
  .ns-card {
    border: 1px solid var(--rule-strong);
    background: color-mix(in oklch, var(--paper) 60%, white);
    padding: 32px 30px 36px;
    border-radius: 6px;
    display: flex; flex-direction: column; gap: 22px;
    min-height: 420px;
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .ns-card:hover {
    border-color: var(--ink);
    background: color-mix(in oklch, var(--paper) 30%, white);
    transform: translateY(-3px);
  }
  .ns-num {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    color: var(--ink-mute);
  }
  .ns-h {
    font-family: var(--serif); font-weight: 500;
    font-size: 44px; line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0;
  }
  .ns-h em { color: var(--gold); font-style: italic; }
  .ns-lede {
    font-family: var(--serif);
    font-size: 22px; line-height: 1.3;
    color: var(--ink);
    font-style: italic;
    margin: 0;
  }
  .ns-body {
    font-family: var(--sans);
    font-size: 14.5px; line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }
  .ns-tags {
    margin-top: auto;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .ns-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    color: var(--ink-soft);

/* ============================ Request Access (message capture) ============================ */
const ROLES = ['Owner', 'Operator', 'Chef', 'Investor', 'Press', 'Curious'];
const SIZES = ['1 outlet', '2â€“4 outlets', '5â€“10 outlets', '10+ outlets', 'Pre-opening'];

function MessageCapture() {
  const [form, setForm] = useState({ name: '', email: '', restaurant: '', role: 'Owner', size: '2â€“4 outlets', message: '' });
  const [errors, setErrors] = useState({});
  const [state, setState] = useState('idle');

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Tell us what to call you.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'A real email, please.';
    if (!form.message.trim() || form.message.trim().length < 12) e.message = 'A sentence or two â€” what should we know?';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = (e) => {
    e.preventDefault();
    if (!validate()) return;
    setState('sending');
    setTimeout(() => setState('sent'), 1200);
  };

  return (
    <section className="scene msg-scene" id="contact">
      <div className="wrap">
        <div className="msg-grid">
          <div className="msg-left">
            <span className="eyebrow"><span className="dot" />Request Access</span>
            <h2>Tell us about your <em>restaurant.</em></h2>
            <p>
              We're hand-picking the first cohort. If you run a kitchen â€” or are about to â€” we'd like to hear from you.
              The more specific you are about where the operation hurts, the better the conversation.
            </p>
            <div className="quote">
              "The owner shouldn't be the integration layer.
              That's the whole reason we built this."
              <span className="who">Abhishek Bose Â· Founder</span>
            </div>
          </div>

          <div>
            {state === 'sent' ? (
              <div className="form-success">
                <div className="check"><Icon name="check" size={22} /></div>
                <h3>Message <em>received.</em></h3>
                <p>Thanks, {form.name.split(' ')[0]}. We'll write back within two business days â€” usually faster.</p>
              </div>
            ) : (
              <form className="form-card" onSubmit={submit} noValidate>
                <div className="form-row">
                  <div className={`field ${errors.name ? 'err' : ''}`}>
                    <label htmlFor="f-name">Your name</label>
                    <input id="f-name" type="text" value={form.name} onChange={(e) => set('name', e.target.value)} placeholder="Abhishek Bose" />
                    {errors.name && <div className="err-msg">{errors.name}</div>}
                  </div>
                  <div className={`field ${errors.email ? 'err' : ''}`}>
                    <label htmlFor="f-email">Email</label>
                    <input id="f-email" type="email" value={form.email} onChange={(e) => set('email', e.target.value)} placeholder="you@your-restaurant.com" />
                    {errors.email && <div className="err-msg">{errors.email}</div>}
                  </div>
                </div>

                <div className="form-row">
                  <div className="field">
                    <label htmlFor="f-rest">Restaurant / Group <span style={{ color: 'var(--ink-mute)' }}>(optional)</span></label>
                    <input id="f-rest" type="text" value={form.restaurant} onChange={(e) => set('restaurant', e.target.value)} placeholder="e.g. Park Plaza, Pan-Asian" />
                  </div>
                  <div className="field">
                    <label htmlFor="f-size">Operation size</label>
                    <select id="f-size" value={form.size} onChange={(e) => set('size', e.target.value)}>
                      {SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>

                <div className="field">
                  <label>You are aâ€¦</label>
                  <div className="role-chips" role="radiogroup">
                    {ROLES.map((r) => (
                      <button
                        key={r}
                        type="button"
                        role="radio"
                        aria-checked={form.role === r}
                        className="chip"
                        data-on={form.role === r}
                        onClick={() => set('role', r)}>
                        {r}
                      </button>
                    ))}
                  </div>
                </div>

                <div className={`field ${errors.message ? 'err' : ''}`}>
                  <label htmlFor="f-msg">
                    What should we know?
                    <span className="count">{form.message.length} / 600</span>
                  </label>
                  <textarea
                    id="f-msg"
                    value={form.message}
                    onChange={(e) => set('message', e.target.value.slice(0, 600))}
                    placeholder="The shift where everything broke. The metric you can't get to. The vacation you haven't taken. Any of it." />
                  {errors.message
                    ? <div className="err-msg">{errors.message}</div>
                    : <div className="hint">We read every message. No CRM auto-responder, we promise.</div>}
                </div>

                <div className="submit-row">
                  <div className="privacy">By submitting you agree we may write back. We don't sell data, ever.</div>
                  <button className="submit-btn" type="submit" disabled={state === 'sending'}>
                    {state === 'sending' ? 'Sendingâ€¦' : 'Send message'}
                    <Icon name="arrow" size={14} />
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================ App ============================ */
function App() {
  const [active, setActive] = useState('');

  useEffect(() => {
    const ids = NAV.map((n) => n.id);
    const onScroll = () => {
      const y = window.scrollY + 120;
      let cur = '';
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) cur = id;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <>
      <Nav active={active} />
      <Hero />
      <NervousSystem />
      <Foundation />
      <DinnerRush />
      <RealService />
      <Story />
      <Pricing />
      <MessageCapture />
      <ClosingCTA />
      <Footer />
    </>
  );
}
